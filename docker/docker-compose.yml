name: dataflow
services:
  traefik:
    image: traefik:v2.10
    command:
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
      - "--providers.docker=true"
      - "--providers.docker.network=dataflow"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=web"
    networks:
      - dataflow

  nats:
    image: nats:latest
    ports:
      - "4222:4222"   # Main client connections
      - "8222:8222"   # Monitoring endpoint
    restart: unless-stopped
    networks:
      - dataflow

  frontend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.docker.network=dataflow"
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: runner
    networks:
      - dataflow
    depends_on:
      - traefik

  ws-gateway:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ws-gateway.entrypoints=web"
      - "traefik.http.routers.ws-gateway.service=ws-gateway"
      - "traefik.http.services.ws-gateway.loadbalancer.server.port=3001"
      - "traefik.docker.network=dataflow"
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: wsserver
    networks:
      - dataflow
    depends_on:
      - traefik
  
  runner:
    build:
      context: ..
    networks:
      - dataflow

networks:
  dataflow:
    name: dataflow
