services:
  traefik:
    labels:
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
    restart: unless-stopped

  nextjs:
    labels:
      - "traefik.http.routers.next.rule=Host(`dataflow-ide.local`)"
    env_file:
      - .env.docker.local
      - ../apps/frontend/.env.local
    build:
      dockerfile: docker/Dockerfile.dev
      target: nextjs
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    restart: unless-stopped
    volumes:
      - ../apps/frontend/:/app:cached
      - ./.env.docker.local:/app/.env.docker.local
      - ../apps/frontend/.env.local:/app/.env.local
      - /app/node_modules  # anonymous volume INSIDE container
      # - next_cache:/app/.next
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=4096
    command: ["npm", "run", "dev:next"]
    user: "${USER_ID}:${GROUP_ID}"
    # ports:
    #   - "3000:3000"

  ws-server:
    labels:
      - "traefik.http.routers.ws-server.rule=Host(`ws.dataflow-ide.local`) && PathPrefix(`/ws`)"
      - "traefik.http.services.ws-server.loadbalancer.sticky.cookie.name=ws_sticky"
    env_file:
      - .env.docker.local
      - ../apps/frontend/.env.local
    build:
      dockerfile: docker/Dockerfile.dev
      target: wsserver
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    restart: unless-stopped
    volumes:
      - ../apps/frontend/:/app:cached
      - ./.env.docker.local:/app/.env.docker.local
      - ../apps/frontend/.env.local:/app/.env.local
      - /app/node_modules  # anonymous volume INSIDE container
    environment:
      - NODE_ENV=development
    command: ["npm", "run", "dev:wss"]
    user: "${USER_ID}:${GROUP_ID}"

